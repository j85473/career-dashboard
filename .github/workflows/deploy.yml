name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

concurrency:
  group: "deploy-pi"
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

      - name: Build Next.js App
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.80.154.113

      - name: Setup SSH Keys
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Add Pi to known_hosts
        run: |
          mkdir -p ~/.ssh
          for i in {1..5}; do
            if ssh-keyscan -H 100.80.154.113 >> ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan failed, retrying in 3 seconds..."
            sleep 3
          done

      - name: Run Deployment Script
        env:
          PI_SUDO_PASSWORD: ${{ secrets.PI_SUDO_PASSWORD }}
          ACTIVATION_MODE: ${{ vars.PI_ACTIVATION_MODE || 'normal' }}
          # Mirrored from the Mac's canonical .env by `npm run keys:sync`.
          # Deployment fails closed when the mirror is missing.
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
          PI_HOST: 100.80.154.113
          DB_BACKUP_DIR: /mnt/pgdata/career-dashboard.db-backups
          ATS_ACQUISITION_ROLLOUT_PROFILE: ledger-v2
        run: bash scripts/deploy.sh
