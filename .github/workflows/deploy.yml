name: Deploy to M70

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "deploy-m70"
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

      - name: Build Next.js App
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.107.116.123

      - name: Setup SSH Keys
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Pin the verified M70 host key
        run: |
          mkdir -p ~/.ssh
          echo '100.107.116.123 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJgoU18XJHgX9cv3cubbx7B6di/meYTeuT9mi6yi6bF2' >> ~/.ssh/known_hosts

      - name: Deploy web, acquisition, scheduler and watchdog together
        if: vars.M70_TRANSFER_STAGE != 'prepare'
        env:
          ACTIVATION_MODE: ${{ vars.PI_ACTIVATION_MODE || 'normal' }}
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
        run: |
          test -n "$RAPIDAPI_KEYS" || { echo 'Deployment requires canonical RAPIDAPI_KEYS'; exit 1; }
          bash scripts/deployment/deploy-m70.sh
