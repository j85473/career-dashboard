name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main

concurrency:
  group: "deploy-pi"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

      - name: Build Next.js App
        run: npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH Keys
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}

      - name: Add Pi to known_hosts
        run: |
          mkdir -p ~/.ssh
          for i in {1..5}; do
            if ssh-keyscan -H 100.80.154.113 >> ~/.ssh/known_hosts; then
              break
            fi
            echo "ssh-keyscan failed, retrying in 3 seconds..."
            sleep 3
          done

      - name: Run Deployment Script
        env:
          PI_SUDO_PASSWORD: ${{ secrets.PI_SUDO_PASSWORD }}
          ACTIVATION_MODE: ${{ vars.PI_ACTIVATION_MODE || 'normal' }}
          # Source of truth for the Pi's RapidAPI keys. The Pi's .env is never
          # rsynced, so without this the two hosts drift apart silently.
          RAPIDAPI_KEYS: ${{ secrets.RAPIDAPI_KEYS }}
          PI_HOST: 100.80.154.113
          DB_BACKUP_DIR: /mnt/pgdata/career-dashboard.db-backups
        run: bash scripts/deploy.sh
