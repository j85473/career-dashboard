name: Prepare authorized M70 migration controls
on:
  push:
    branches: [codex/m70-migration]
    paths:
      - scripts/migration/pi-source-control.sh
      - .github/workflows/m70-migration-admin.yml
permissions:
  contents: read
  id-token: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: 100.80.154.113
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_KEY }}
      - name: Pin the previously verified source host key
        run: |
          mkdir -p ~/.ssh
          echo '100.80.154.113 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAVy7wu2zwFetEaVDTiIqBd4uxXn7bflcaE82JmS4/KX' >> ~/.ssh/known_hosts
      - name: Install fixed migration controls without exposing a password in arguments
        env:
          SOURCE_SUDO_PASSWORD: ${{ secrets.PI_SUDO_PASSWORD }}
        run: |
          set -euo pipefail
          scp scripts/migration/pi-source-control.sh j85473@100.80.154.113:/home/j85473/pi-source-control.reviewed
          # The existing credential goes only through stdin; never a remote command or log.
          printf '%s\n' "$SOURCE_SUDO_PASSWORD" | ssh j85473@100.80.154.113 "sudo -S -p '' install -o root -g root -m 755 /home/j85473/pi-source-control.reviewed /usr/local/sbin/career-migration-control"
          printf '%s\n' 'j85473 ALL=(root) NOPASSWD: /usr/local/sbin/career-migration-control inspect, /usr/local/sbin/career-migration-control stop, /usr/local/sbin/career-migration-control fence, /usr/local/sbin/career-migration-control dump, /usr/local/sbin/career-migration-control stream-dump' > /tmp/migration-sudoers
          scp /tmp/migration-sudoers j85473@100.80.154.113:/home/j85473/migration-sudoers.reviewed
          printf '%s\n' "$SOURCE_SUDO_PASSWORD" | ssh j85473@100.80.154.113 "sudo -S -p '' /usr/sbin/visudo -cf /home/j85473/migration-sudoers.reviewed"
          printf '%s\n' "$SOURCE_SUDO_PASSWORD" | ssh j85473@100.80.154.113 "sudo -S -p '' install -o root -g root -m 440 /home/j85473/migration-sudoers.reviewed /etc/sudoers.d/career-migration"
          ssh j85473@100.80.154.113 'sudo -n /usr/local/sbin/career-migration-control inspect'
